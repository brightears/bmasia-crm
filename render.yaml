services:
  - type: web
    name: bmasia-crm
    env: python
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: COMMERCIAL_DOCUMENT_V2_PREVIEW_ENABLED
        value: "True"
      - key: COMMERCIAL_DOCUMENT_V2_QUOTE_LIVE
        value: "True"
      - key: COMMERCIAL_DOCUMENT_V2_INVOICE_LIVE
        value: "True"
      - key: COMMERCIAL_DOCUMENT_V2_RECEIPT_LIVE
        value: "False"
      - key: RUN_DEPLOY_BOOTSTRAP
        value: "False"
      - key: RUN_LEGACY_DEPLOY_REPAIRS
        value: "False"
      - key: SOUNDTRACK_API_TOKEN
        sync: false
      - key: SOUNDTRACK_CLIENT_ID
        sync: false
      - key: SOUNDTRACK_CLIENT_SECRET
        sync: false

  # ALL email cron jobs DISABLED (30.03.2026)
  # Lyra handles all client communication: renewals, payments, quarterly check-ins, prospect outreach
  # Re-enable only if Lyra goes offline for extended period
  #
  # Previously:
  # - bmasia-crm-email-sender: daily 9am (renewal, payment, quarterly, zone-alerts)
  # - bmasia-crm-email-sequences: every 20min (prospect sequences)
