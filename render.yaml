services:
  - type: web
    name: bmasia-crm
    env: python
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      # SECRET_KEY and FIELD_ENCRYPTION_KEY are required in production: with either one
      # missing or equal to the built-in development default, the app stops at startup
      # (build, pre-deploy and start all fail, so the running version keeps serving).
      # The crons that run this app are defined in the Render dashboard, not here; each
      # needs both variables too. One-off jobs use this service's environment.
      - key: SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: COMMERCIAL_DOCUMENT_V2_PREVIEW_ENABLED
        value: "True"
      - key: COMMERCIAL_DOCUMENT_V2_QUOTE_LIVE
        value: "True"
      - key: COMMERCIAL_DOCUMENT_V2_INVOICE_LIVE
        value: "True"
      - key: COMMERCIAL_DOCUMENT_V2_CONTRACT_LIVE
        value: "True"
      - key: COMMERCIAL_DOCUMENT_V2_RECEIPT_LIVE
        value: "False"
      - key: RUN_DEPLOY_BOOTSTRAP
        value: "False"
      - key: RUN_LEGACY_DEPLOY_REPAIRS
        value: "False"
      - key: SOUNDTRACK_API_TOKEN
        sync: false
      - key: SOUNDTRACK_CLIENT_ID
        sync: false
      - key: SOUNDTRACK_CLIENT_SECRET
        sync: false

  # ALL email cron jobs DISABLED (30.03.2026)
  # Lyra handles all client communication: renewals, payments, quarterly check-ins, prospect outreach
  # Re-enable only if Lyra goes offline for extended period
  #
  # Previously:
  # - bmasia-crm-email-sender: daily 9am (renewal, payment, quarterly, zone-alerts)
  # - bmasia-crm-email-sequences: every 20min (prospect sequences)
